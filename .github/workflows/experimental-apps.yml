name: Experimental apps

on:
  pull_request:
    paths:
      - 'apps/live_adjustments/bm3_*.js'
      - 'apps/zf8hp/**'
      - 'kit/runtime/diag.js'
      - 'kit/tools/test_bm3_live.js'
      - 'kit/tools/test_zf8hp.js'
      - 'kit/tools/test_diag_options.js'
      - '.github/workflows/experimental-apps.yml'
  push:
    paths:
      - 'apps/live_adjustments/bm3_*.js'
      - 'apps/zf8hp/**'
      - 'kit/runtime/diag.js'
      - 'kit/tools/test_bm3_live.js'
      - 'kit/tools/test_zf8hp.js'
      - 'kit/tools/test_diag_options.js'
      - '.github/workflows/experimental-apps.yml'

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node kit/tools/test_bm3_live.js
      - run: node kit/tools/test_zf8hp.js
      - run: node kit/tools/test_diag_options.js
